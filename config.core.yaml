# Application metadata.
app:
  name: sbterm-core
  version: dev

# HTTP listen address. Use ":8082" to listen on all interfaces inside a container.
port: ":8082"

# PostgreSQL connection URL and connection pool settings.
# In Docker Compose, use host "postgres". When running locally, use "localhost".
database:
  url: postgres://postgres:postgres@localhost:5433/sbterm?sslmode=disable
  max_conns: 10
  min_conns: 0
  max_conn_idle_time: 30m
  max_conn_lifetime: 1h

# Redis connection URL and client settings.
# In Docker Compose, use host "redis". When running locally, use "localhost".
redis:
  url: redis://localhost:6380/0
  max_retries: 3
  pool_size: 10
  min_idle_conns: 0
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

# Logging settings.
# format supports "text" and "json".
log:
  level: info
  format: text
  add_source: false

# Per-client HTTP rate limit settings.
# Set rate <= 0 to disable rate limiting.
rate_limit:
  rate: 50
  burst: 100

# Authentication settings.
auth:
  jwt_secret: change-me-in-prod
  access_ttl: 15m
  refresh_ttl: 720h
  default_user_ttl: 720h
  bcrypt_cost: 12

# HTTP server timeout settings.
http:
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s
