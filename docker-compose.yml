services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: sbterm-server:${APP_VERSION:-dev}
    container_name: sbterm-server
    restart: always
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      questdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:18-alpine
    container_name: sbterm-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sbterm}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sbterm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: sbterm-redis
    restart: always
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  questdb:
    image: questdb/questdb:10.0.0
    container_name: sbterm-questdb
    restart: always
    environment:
      QDB_HTTP_USER: ${QDB_HTTP_USER:-questdb}
      QDB_HTTP_PASSWORD: ${QDB_HTTP_PASSWORD:-questdb}
    ports:
      - "${QUESTDB_HOST_PORT:-9000}:9000"
    volumes:
      - questdb-data:/var/lib/questdb
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-u", "${QDB_HTTP_USER:-questdb}:${QDB_HTTP_PASSWORD:-questdb}", "http://127.0.0.1:9000/exec?query=select%201"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  questdb-data:
