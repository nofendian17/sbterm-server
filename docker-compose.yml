services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: sbterm-api:${APP_VERSION:-dev}
    container_name: sbterm-api
    restart: always
    volumes:
      - ./config.api.yaml:/app/config.api.yaml:ro
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  ws:
    build:
      context: .
      dockerfile: apps/ws/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: sbterm-ws:${APP_VERSION:-dev}
    container_name: sbterm-ws
    restart: always
    volumes:
      - ./config.ws.yaml:/app/config.ws.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  ingest:
    build:
      context: .
      dockerfile: apps/ingest/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: sbterm-ingest:${APP_VERSION:-dev}
    container_name: sbterm-ingest
    restart: always
    volumes:
      - ./config.ingest.yaml:/app/config.ingest.yaml:ro
    depends_on:
      questdb:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  stream:
    build:
      context: .
      dockerfile: apps/stream/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: sbterm-stream:${APP_VERSION:-dev}
    container_name: sbterm-stream
    restart: always
    volumes:
      - ./config.stream.yaml:/app/config.stream.yaml:ro
    ports:
      - "${STREAM_HOST_PORT:-8081}:8081"
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  account:
    build:
      context: .
      dockerfile: apps/account/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: sbterm-account:${APP_VERSION:-dev}
    container_name: sbterm-account
    restart: always
    volumes:
      - ./config.account.yaml:/app/config.account.yaml:ro
    ports:
      - "${ACCOUNT_HOST_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:18-alpine
    container_name: sbterm-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sbterm}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sbterm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: sbterm-redis
    restart: always
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  questdb:
    image: questdb/questdb:10.0.0
    container_name: sbterm-questdb
    restart: always
    environment:
      QDB_HTTP_USER: ${QDB_HTTP_USER:-questdb}
      QDB_HTTP_PASSWORD: ${QDB_HTTP_PASSWORD:-questdb}
    ports:
      - "${QUESTDB_HOST_PORT:-9000}:9000"
    volumes:
      - questdb-data:/var/lib/questdb
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-u", "${QDB_HTTP_USER:-questdb}:${QDB_HTTP_PASSWORD:-questdb}", "http://127.0.0.1:9000/exec?query=select%201"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.12
    container_name: sbterm-redpanda
    restart: always
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --kafka-addr PLAIN://0.0.0.0:29092
      - --advertise-kafka-addr PLAIN://redpanda:29092
      - --set redpanda.auto_create_topics_enabled=true
    ports:
      - "${REDPANDA_HOST_PORT:-29092}:29092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  questdb-data:
  redpanda-data:
