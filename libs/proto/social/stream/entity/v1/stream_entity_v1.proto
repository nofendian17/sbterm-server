package social.stream.entity.v1;

option go_package = "github.com/nofendian17/sbterm-server/internal/infrastructure/stockbit/proto/social/stream/entity/v1;streamentityv1";

message User {
  int32 id = 1; // T:5
  string username = 2; // T:9
  string country = 3; // T:9
  string avatar = 4; // T:9
}

message ReplyInfo {
  User user = 1;
}

message FollowingActivity {
  repeated User users = 1;
  string info = 2; // T:9
}

message ShareTradeInfo {
  enum OrderType {
    ORDER_TYPE_UNSPECIFIED = 0;
    ORDER_TYPE_BUY = 1;
    ORDER_TYPE_SELL = 2;
  }

  message PNL {
    enum Type {
      TYPE_UNSPECIFIED = 0;
      TYPE_GAIN = 1;
      TYPE_LOSS = 2;
    }

    string percentage = 1; // T:9
    Type type = 2;
  }

  string text = 1; // T:9
  string symbol = 2; // T:9
  OrderType order_type = 3;
  string price = 4; // T:9
  PNL pnl = 5;
}

// Tidak direferensikan oleh field mana pun di graph mencapai (unreachable),
// disertakan untuk kelengkapan modul.
message Insider {
