    TYPE_UNSPECIFIED = 0;
    TYPE_LOCAL = 1;
    TYPE_FOREIGN = 2;
  }

  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_BOUGHT = 1;
    ACTION_SOLD = 2;
  }

  message Shareholder {
    string name = 1; // T:9
    int32 id = 2; // T:5
  }
