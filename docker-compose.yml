services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: sbterm-server:${APP_VERSION:-dev}
    container_name: sbterm-server
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-sbterm-server}
      APP_VERSION: ${APP_VERSION:-dev}
      APP_PORT: :8080
      APP_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sbterm}?sslmode=disable
      APP_REDIS_URL: ${APP_REDIS_URL:-redis://redis:6379/0}
      APP_REDIS_MAX_RETRIES: ${APP_REDIS_MAX_RETRIES:-3}
      APP_REDIS_POOL_SIZE: ${APP_REDIS_POOL_SIZE:-10}
      APP_REDIS_MIN_IDLE_CONNS: ${APP_REDIS_MIN_IDLE_CONNS:-0}
      APP_REDIS_DIAL_TIMEOUT: ${APP_REDIS_DIAL_TIMEOUT:-5s}
      APP_REDIS_READ_TIMEOUT: ${APP_REDIS_READ_TIMEOUT:-3s}
      APP_REDIS_WRITE_TIMEOUT: ${APP_REDIS_WRITE_TIMEOUT:-3s}
      APP_DB_MAX_CONNS: ${APP_DB_MAX_CONNS:-10}
      APP_DB_MIN_CONNS: ${APP_DB_MIN_CONNS:-0}
      APP_DB_MAX_CONN_IDLE_TIME: ${APP_DB_MAX_CONN_IDLE_TIME:-5m}
      APP_DB_MAX_CONN_LIFETIME: ${APP_DB_MAX_CONN_LIFETIME:-30m}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
      APP_LOG_FORMAT: ${APP_LOG_FORMAT:-json}
      APP_LOG_ADD_SOURCE: ${APP_LOG_ADD_SOURCE:-false}
      APP_RATE_LIMIT_RATE: ${APP_RATE_LIMIT_RATE:-10}
      APP_RATE_LIMIT_BURST: ${APP_RATE_LIMIT_BURST:-20}
      APP_HTTP_READ_TIMEOUT: ${APP_HTTP_READ_TIMEOUT:-10s}
      APP_HTTP_WRITE_TIMEOUT: ${APP_HTTP_WRITE_TIMEOUT:-10s}
      APP_HTTP_IDLE_TIMEOUT: ${APP_HTTP_IDLE_TIMEOUT:-60s}
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:18-alpine
    container_name: sbterm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sbterm}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sbterm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: sbterm-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
